name: Input security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
